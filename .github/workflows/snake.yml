name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - uses: Platane/snk@v3
        with:
          github_user_name: irfanafifiromzi
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#ff5ca8&color_dots=#f1ecff,#cfc5ff,#9f8cff,#6f57ff,#4c32ff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffd23f&color_dots=#161b22,#2a2066,#3d2cab,#5a44f0,#9a88ff
      
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
