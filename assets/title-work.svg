<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="140" viewBox="0 0 1280 140" role="img" aria-label="SELECTED WORK"><title>SELECTED WORK</title><style>@font-face{font-family:'Dela Gothic One';font-weight:100 900;src:url(data:font/woff2;base64,) format('woff2');}
  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
  @keyframes twinkle{0%,100%{transform:scale(.55) rotate(0deg)}50%{transform:scale(1.12) rotate(25deg)}}
  @keyframes pop{0%{transform:scale(.3);opacity:0}65%{transform:scale(1.07);opacity:1}100%{transform:scale(1)}}
  .tw{transform-box:fill-box;transform-origin:center;animation:twinkle 2.6s ease-in-out infinite}
  .bob{animation:bob 3.4s ease-in-out infinite}
  .pop{transform-box:fill-box;transform-origin:center;animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}</style>
